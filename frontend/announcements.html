<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./icon.png" type="image/x-icon">
    <link rel="stylesheet" href="./style.css">
    <title>成信大校园助手 - 校园通知</title>
</head>
<body>
    <div class="outline">
        <nav id="side_left"></nav>
        <!-- 右边 -->
        <main class="side_right">
            <header class="headline">
                <div class="headline_hidemenu">
                    <button id="button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-arrow-bar-right" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                            <path fill-rule="evenodd" d="M6 8a.5.5 0 0 0 .5.5h5.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L12.293 7.5H6.5A.5.5 0 0 0 6 8Zm-2.5 7a.5.5 0 0 1-.5-.5v-13a.5.5 0 0 1 1 0v13a.5.5 0 0 1-.5.5Z"/>
                        </svg>
                    </button>
                </div>
                <div class="headline_head">校园通知</div>
                <div class="share"></div>
            </header>
            <div class="campus_container">
                <div class="glass_card campus_panel">
                    <div class="campus_toolbar">
                        <div class="campus_search_wrap">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                            </svg>
                            <input type="search" id="ann-search" class="campus_search" placeholder="搜索通知标题、内容…" aria-label="搜索校园通知">
                            <button id="ann-search-btn" class="btn btn-primary campus_search_btn" type="button">搜索</button>
                        </div>
                        <div class="campus_chips" id="ann-categories" role="tablist" aria-label="通知栏目"></div>
                    </div>
                    <div id="ann-loading" class="campus_loading" hidden>
                        <div class="spinner"></div>
                        <span class="loading-text">正在加载通知…</span>
                    </div>
                    <div id="ann-list" class="campus_list"></div>
                    <div id="ann-empty" class="campus_empty" hidden>
                        <div class="campus_empty_icon">🔍</div>
                        <p>没有找到相关通知，换个关键词试试。</p>
                    </div>
                    <div class="campus_pager" id="ann-pager">
                        <button id="ann-prev" class="btn" type="button">‹ 上一页</button>
                        <span id="ann-page-info" class="campus_page_info"></span>
                        <button id="ann-next" class="btn" type="button">下一页 ›</button>
                    </div>
                </div>
            </div>
            <div id="ann-detail-overlay" class="campus_overlay" hidden>
                <div class="campus_detail glass_card" role="dialog" aria-modal="true" aria-labelledby="ann-detail-title">
                    <div class="campus_detail_head">
                        <div class="campus_detail_title_group">
                            <span id="ann-detail-category" class="campus_tag"></span>
                            <span id="ann-detail-date" class="campus_meta"></span>
                        </div>
                        <button id="ann-detail-close" class="campus_close" type="button" aria-label="关闭详情">×</button>
                    </div>
                    <h2 id="ann-detail-title" class="campus_detail_title"></h2>
                    <div id="ann-detail-body" class="campus_md"></div>
                    <div id="ann-detail-source" class="campus_meta"></div>
                </div>
            </div>
            <div id="toast-container" class="feedback-top"></div>
        </main>
    </div>

    <script src="./marked.min.js"></script>
    <script src="./purify.min.js"></script>
    <script type="module" src="./src/sidebar.ts" data-active="announcements"></script>
    <script type="module" src="./src/campus/announcements.ts"></script>
</body>
</html>
